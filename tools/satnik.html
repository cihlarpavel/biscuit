<!doctype html><meta charset="utf-8"><title>Šatník – všechny věci</title>
<style>body{font-family:system-ui;background:#fff4f8;padding:12px}h2{font-size:15px;margin:14px 0 6px}.r{display:flex;flex-wrap:wrap;gap:8px}.r div{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#8a7891;width:84px;text-align:center}</style>
<script type="module">
import { VECI, KATEGORIE, postavicka } from '../js/postavicka.js';
const k = new URLSearchParams(location.search).get('k');
document.body.innerHTML = KATEGORIE.filter(x => !k || x.id === k).map(kat => `<h2>${kat.nazev}</h2><div class="r">${VECI.filter(v => v.kat === kat.id).map(v =>
  `<div>${postavicka({ [kat.id]: v.id }, 84, kat.hlava ? 'hlava' : 'cela')}${v.nazev}<br>${v.cena}</div>`).join('')}</div>`).join('');
</script>
